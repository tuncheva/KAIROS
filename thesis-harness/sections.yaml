# Карта на дипломната работа за проверките на промените (changes.*, pr-check).
#
# id       – това, което PR описание пише под `## Documentation impact` (вж. CLAUDE.md).
#            За номерираните раздели е номерът от заглавието в документа.
# title    – заглавието в документа.
# en       – кратко описание на английски (PR описанията са на английски).
# paths    – пътища в репото, които разделът описва (glob: ** през папки, * в една).
#            pr-check предупреждава, когато PR пипа тези файлове, без да назове раздела.
# structural_only – броят се само добавени/изтрити/преименувани файлове
#            (картата на сайта се мени с нов маршрут, не с редакция на страница).
# heading  – регулярен израз за заглавие без номер (Увод, Приложения).
# in_document: false – цел извън дипломната (README).
#
# Редът е редът в документа. 2.8.5 е с празно заглавие в .docx; заглавието тук е
# по първия му абзац.

