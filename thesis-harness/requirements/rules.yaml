sources:
- id: D1
  file: Указания_дипломен_проект_AI.docx
  title: УКАЗАНИЯ ЗА РАЗРАБОТВАНЕ НА ДИПЛОМЕН ПРОЕКТ
  sha256: 7f34e19b1368b51d59287f6a327ee4bf0bb2e7dc485379f41765f90e87342c14
  pages: 1
rules:
- id: R01
  title: Тема, свързана със специалността
  quote: темата е свързана със специалността и е утвърдена със задание от ръководителя
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: У\s*В\s*О\s*Д
- id: R02
  title: Посочени източници, библиотеки и чужд код
  quote: ползваните източници, библиотеки и код на други автори са посочени
  doc: D1
  page: 1
  check: semantic
  severity: error
- id: R03
  title: Теорията обосновава, практиката реализира, двете съответстват
  quote: теоретичната част обосновава решението, практическата го реализира, а двете са в съответствие помежду си
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: Глава\s+първа|Глава\s+втора
- id: R04
  title: 'Оформление: заглавие, съдържание, номерация, литература'
  quote: текстът е подреден логично, с ясно заглавие, съдържание, номерация и списък с литература
  doc: D1
  page: 1
  check: semantic
  severity: error
- id: R05
  title: 'Препоръчителна структура: задължителните раздели съществуват'
  quote: Препоръчителна структура
  doc: D1
  page: 1
  check: req.required-headings
  severity: warning
  params:
    headings:
    - У\s*В\s*О\s*Д
    - З\s*А\s*К\s*Л\s*Ю\s*Ч\s*Е\s*Н\s*И\s*Е
    - ЛИТЕРАТУРА
    - П\s*Р\s*И\s*Л\s*О\s*Ж\s*Е\s*Н\s*И\s*Я
- id: R06
  title: 'Увод: актуалност, цел, задачи, технологии'
  quote: Актуалност на темата, цел, конкретни задачи, използвани технологии.
  doc: D1
  page: 1
  check: semantic
  severity: warning
  applies_to: У\s*В\s*О\s*Д
- id: R07
  title: 'Теоретична част: понятия, методи, обосновка, ограничения и рискове'
  quote: Основни понятия и методи, обосновка на избрания подход и технологии, ограничения и рискове.
  doc: D1
  page: 1
  check: semantic
  severity: warning
  applies_to: Глава\s+първа
- id: R08
  title: 'Практическа част: архитектура, данни, реализация, фрагменти от кода, тестване, резултати'
  quote: 'Описание на решението: архитектура, данни, ключови стъпки на реализацията, фрагменти от кода, тестване
    и резултати.'
  doc: D1
  page: 1
  check: semantic
  severity: warning
  applies_to: Глава\s+втора
- id: R09
  title: 'Заключение: постигнато спрямо целта, ограничения, подобрения'
  quote: Какво е постигнато спрямо целта, ограничения, възможни подобрения.
  doc: D1
  page: 1
  check: semantic
  severity: warning
  applies_to: З\s*А\s*К\s*Л\s*Ю\s*Ч\s*Е\s*Н\s*И\s*Е
- id: R10
  title: 'Приложения: код, схеми, екранни снимки, тестови данни'
  quote: Допълнителен код, схеми, екранни снимки, тестови данни.
  doc: D1
  page: 1
  check: semantic
  severity: info
  applies_to: П\s*Р\s*И\s*Л\s*О\s*Ж\s*Е\s*Н\s*И\s*Я
- id: R11
  title: Собствена работа, не само готов инструмент
  quote: проектът трябва да съдържа собствена работа, а не само използване на готов инструмент.
  doc: D1
  page: 1
  check: semantic
  severity: error
- id: R12
  title: 2.2-1 Реален проблем и ясна задача
  quote: В увода са описани проблемът, целта и очакваният резултат
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: У\s*В\s*О\s*Д
- id: R13
  title: 2.2-2 Собствена програмна логика
  quote: 'Има собствен код: обработка на входните данни, подготовка на заявките, обработка и проверка на отговорите,
    потребителски интерфейс или интеграция.'
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: Глава\s+втора
- id: R14
  title: 2.2-3 Работа с данни
  quote: Описано е откъде са данните, как са подготвени (почистване, структуриране) и как се използват.
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: Глава\s+втора
- id: R15
  title: 2.2-4 Оценка на резултата
  quote: Има тестови примери и показатели (например точност, брой грешки) или сравнение на два подхода; направени
    са изводи.
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: Глава\s+втора|З\s*А\s*К\s*Л\s*Ю\s*Ч\s*Е\s*Н\s*И\s*Е
- id: R16
  title: 2.2-5 Разбиране на технологията
  quote: Теоретичната част обяснява със собствени думи основните понятия, ограниченията и рисковете (грешни отговори,
    пристрастия, поверителност на данните).
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: Глава\s+първа
- id: R17
  title: 2.2-6 Документация и работещ продукт
  quote: Проектът може да се стартира и демонстрира, а описанието позволява да бъде възпроизведен.
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: Глава\s+втора|П\s*Р\s*И\s*Л\s*О\s*Ж\s*Е\s*Н\s*И\s*Я
- id: R18
  title: 2.3 Обосновка на избраната технология (API)
  quote: Обосновка защо е избрана именно тази технология.
  doc: D1
  page: 1
  check: semantic
  severity: error
  applies_to: Глава\s+първа|Глава\s+втора
note: Обем, срокове и критерии за оценяване се определят от индивидуалното задание и Наредба № 1 от 19.02.2020 г.
  (D1, „Важно“) – не са включени, докато тези документи не бъдат импортирани.
