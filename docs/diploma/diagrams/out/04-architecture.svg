ационен слой</b><br />Next.js 16 · React 19 · Tailwind CSS 4<br />GSAP · Chart.js · next-intl (2 езика: български и английски)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l2-1" data-look="classic" transform="translate(277, 288.5)"><rect class="basic label-container" style="fill:#efe8f8 !important;stroke:#6a4c9c !important" x="-199.6484375" y="-48" width="399.296875" height="96"/><g class="label" style="" transform="translate(-175.6484375, -36)"><rect/><foreignObject width="351.296875" height="72"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 420px; text-align: center;"><span class="nodeLabel"><p><b>Комуникационен слой</b><br />tRPC v11 (17 рутера) · TanStack Query<br />Next.js API Routes · Socket.IO (отделен сървър)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l3-2" data-look="classic" transform="translate(277, 507.5)"><rect class="basic label-container" style="fill:#f6e6f3 !important;stroke:#9b3f8a !important" x="-234" y="-96" width="468" height="192"/><g class="label" style="" transform="translate(-210, -84)"><rect/><foreignObject width="420" height="168"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 420px; text-align: center; width: 420px;"><span class="nodeLabel"><p><b>Бизнес логика и ИИ</b><br />Оркестратор · 6 разговорни агента: Mentor и 5 специализирани<br />цикъл с инструменти · RAG над документи · дълготрайна памет<br />4 планирани агента и потребителски графици · поправка на JSON · Zod схеми</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-l4-3" data-look="classic" transform="translate(277, 726.5)"><rect class="basic label-container" style="fill:#fbefe0 !important;stroke:#b8741a !important" x="-203.9609375" y="-48" width="407.921875" height="96"/><g class="label" style="" transform="translate(-1