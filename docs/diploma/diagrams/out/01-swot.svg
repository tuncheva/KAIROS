y="5" r="5" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_block-circleStart-margin" class="marker block" viewBox="0 0 10 10" refX="-2" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto"><circle cx="5" cy="5" r="5" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_block-crossEnd" class="marker cross block" viewBox="0 0 11 11" refX="12" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_block-crossStart" class="marker cross block" viewBox="0 0 11 11" refX="-1" refY="5.2" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M 1,1 l 9,9 M 10,1 l -9,9" class="arrowMarkerPath" style="stroke-width: 2; stroke-dasharray: 1, 0;"/></marker><marker id="my-svg_block-crossEnd-margin" class="marker cross block" viewBox="0 0 15 15" refX="17.7" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5;"/></marker><marker id="my-svg_block-crossStart-margin" class="marker cross block" viewBox="0 0 15 15" refX="-3.5" refY="7.5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M 1,1 L 14,14 M 1,14 L 14,1" class="arrowMarkerPath" style="stroke-width: 2.5; stroke-dasharray: 1, 0;"/></marker><g class="block"><g class="node default flowchart-label" id="my-svg-S" transform="translate(264.203125, -72)"><rect class="basic label-container" style="fill:#e3f3ea !important;stroke:#1f6b45 !important" rx="0" ry="0" x="-264.203125" y="-68" width="528.40625" height="136"/><g class="label" style="" transform="translate(-248.203125, -48)"><rect/><foreignObject width="496.40625" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 528.406px; text-align: center;"><span class="nodeLabel"><p><b>Силни страни</b><br />• Контрол върху ИИ: по подразбиране всяка промяна се одобрява;<br />• Защита на данните: заключените бележки не стигат до модела;<br />• Задачи, бележки и събития в една среда, на български.</p></span></div></foreignObject></g></g><g class="node default flowchart-label" id="my-svg-W" transform="translate(800.609375, -72)"><rect class="basic label-container" style="fill:#fbe9e7 !important;stroke:#a3322b !important" rx="0" ry="0" x="-264.203125" y="-68" width="528.40625" height="136"/><g class="label" style="" transform="translate(-213.421875, -60)"><rect/><foreignObject width="426.84375" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 528.406px; text-align: center;"><span class="nodeLabel"><p><b>Слаби страни</b><br />• По-слаби ИИ модели от тези на конкурентите;<br />• Зависимост от външни доставчици на модели;<br />• Малко интеграции, няма нативно мобилно приложение;<br />• Ниска популярност.</p></span></div></foreignObject></g></g><g class="node default flowchart-label" id="my-svg-O" transform="translate(264.203125, 72)"><rect class="basic label-container" style="fill:#e8eef8 !important;stroke:#2c4f8f !important" rx="0" ry="0" x="-264.203125" y="-68" width="528.40625" height="136"/><g class="label" style="" transform="translate(-197.8515625, -60)"><rect/><foreignObject width="395.703125" height="120"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 528.406px; text-align: center;"><span class="nodeLabel"><p><b>Възможности</b><br />• Недоверие към ИИ, който действа без разрешение;<br />• Недоволство от отделното заплащане на ИИ;<br />• Изискване за човешки контрол в ЕС;<br />• Няма конкурент, съчетал събития и екипна работа.</p></span></div></foreignObject></g></g><g class="node default flowchart-label" id="my-svg-T" transform="translate(800.609375, 72)"><rect class="basic label-container" style="fill:#fbf3df !important;stroke:#a86400 !important" rx="0" ry="0" x="-264.203125" y="-68" width="528.40625" height="136"/><g class="label" style="" transform="translate(-218.9375, -48)"><rect/><foreignObject width="437.875" height="96"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 528.406px; text-align: center;"><span class="nodeLabel"><p><b>Заплахи</b><br />• Конкурентите бързо добавят ИИ и подобен контрол;<br />• Поскъпване и промени при доставчиците на модели;<br />• Изискванията за лични данни ограничават доставчиците.</p></span></div></foreignObject></g></g></g></svg>